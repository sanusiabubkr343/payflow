spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/payflow
    username: payflow
    password: payflow
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION}   # 24 hours


  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  cloudinary:
    cloud_name: ${CLOUDINARY_CLOUD_NAME}
    api_key: ${CLOUDINARY_API_KEY}
    api_secret: ${CLOUDINARY_API_SECRET}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  output:
    ansi:
      enabled: ALWAYS